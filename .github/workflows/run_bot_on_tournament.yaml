name: Forecast on new AI tournament questions

# Runs bot.py on the seasonal FutureEval tournament only (--mode main).
# MiniBench is left out on purpose: only the first MiniBench a bot maker enters
# counts for the performance grant. To add it, change --mode main to --mode tournament.
#
# Nothing runs on a schedule until the repository variable BOT_ENABLED is "true"
# (Settings -> Secrets and variables -> Actions -> Variables). Running it by hand
# from the Actions tab always works.
on:
  workflow_dispatch:
  # Lets an outside scheduler start a run (GitHub's own cron is often late or
  # skipped, and questions are open for only 3 hours):
  #   POST https://api.github.com/repos/<owner>/<repo>/dispatches
  #   body: {"event_type": "run-bot"}
  repository_dispatch:
    types: [run-bot]
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour

# One run at a time; a new trigger waits for the current run to finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    if: vars.BOT_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        # Questions the bot already forecast are skipped, so most runs find
        # nothing to do and cost nothing.
        run: |
          uv run python bot.py --mode main
        # Secrets and variables live under Settings -> Secrets and variables -> Actions.
        # Required secrets: METACULUS_TOKEN, OPENROUTER_API_KEY. The rest are optional.
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Model tier (free, cheap, strong): see bot_config.py.
          BOT_TIER: ${{ vars.BOT_TIER || 'cheap' }}
          # The bot stops calling models once one run has spent this many USD.
          BOT_MAX_COST_PER_RUN: ${{ vars.BOT_MAX_COST_PER_RUN || '0.60' }}
